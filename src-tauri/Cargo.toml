[package]
name = "schemaguard"
version = "0.1.0"
description = "SchemaGuard desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "schemaguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "chrono",
  "uuid",
  "bigdecimal",
  "json",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
